name: Independent review gate

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  independent-review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4.20.0"
      - run: python scripts/verify_independent_review.py --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
