name: F00 acceptance gate

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8.0.0" "jsonschema>=4.20.0"
      - run: pytest tests/
