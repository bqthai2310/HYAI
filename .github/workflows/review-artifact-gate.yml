name: Review artifact gate

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate-review-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4.20.0"
      - run: python scripts/validate_spec.py --review-artifacts
