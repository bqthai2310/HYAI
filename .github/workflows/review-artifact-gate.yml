name: Review artifact gate

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate-review-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8.0.0" "jsonschema>=4.20.0"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_github_live_state.py
      - run: python scripts/generate_review_artifacts.py --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_spec.py --review-artifacts --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: F00-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: review/
