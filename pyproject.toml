[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyai"
version = "2.1.0"
description = "HYAI — Autonomous Digital Company OS v2.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
cache_dir = ".hyai/cache/pytest"

[tool.setuptools.packages.find]
where = ["src"]
